[package]
name = "ctrmml-lsp"
version = "0.0.14"
edition = "2021"

[dependencies]
pathdiff = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36.0", features = ["full"] }
tower-lsp = "0.20.0"
tower = "0.4"
walkdir = "2.5.0"
url = "2.5.0"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
dirs = "5.0"
