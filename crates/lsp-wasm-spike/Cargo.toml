[package]
name = "lsp-wasm-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Phase 4.3 throwaway: does tower-lsp build for wasm32-unknown-unknown?
# This crate has the minimum dependencies needed to compile a
# LanguageServer trait implementation; if cargo build for wasm32
# succeeds, we know the LSP transport layer can in principle live in
# the same WASM bundle as ctrmml-lang-core.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default tower-lsp pulls in tokio with all features; the LSP itself
# only really needs io-util + sync, so we try with default-features
# off to see what the minimum viable feature set looks like.
tower-lsp = { version = "0.20.0", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.36.0", default-features = false, features = ["sync"] }
