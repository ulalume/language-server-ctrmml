[package]
name = "ctrmml-lang-core"
version = "0.1.0"
edition = "2021"
description = "Pure MML language semantics — chord, transpose, key signature, octave, time signature. WASM-compatible, no I/O."
license = "MIT OR Apache-2.0"

# This crate must remain free of std::fs, std::net, std::process, std::thread,
# and any dependency that pulls them in. It is the shared core for both the
# native LSP (tokio + spawn) and the web build (wasm-bindgen).
#
# To verify: `cargo build -p ctrmml-lang-core --target wasm32-unknown-unknown`

[lib]
name = "ctrmml_lang_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
