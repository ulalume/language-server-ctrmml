name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            os_name: macos
            arch: arm64
          - os: macos-14
            target: x86_64-apple-darwin
            os_name: macos
            arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Enable arm64 apt (Linux aarch64)
        if: matrix.os == 'ubuntu-22.04' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo python3 - <<'PY'
          from pathlib import Path
          def rewrite_list(path: Path) -> None:
              lines = path.read_text().splitlines()
              out = []
              for line in lines:
                  if line.startswith('deb ') and '[arch=' not in line:
                      out.append('deb [arch=amd64] ' + line[4:])
                  elif line.startswith('deb-src ') and '[arch=' not in line:
                      out.append('deb-src [arch=amd64] ' + line[8:])
                  else:
                      out.append(line)
              path.write_text('\n'.join(out) + '\n')
          for p in [Path('/etc/apt/sources.list')]:
              if p.exists():
                  rewrite_list(p)
          list_dir = Path('/etc/apt/sources.list.d')
          for p in list_dir.glob('*.list'):
              rewrite_list(p)
          for p in list_dir.glob('*.sources'):
              lines = p.read_text().splitlines()
              if not any(line.strip().lower().startswith('architectures:') for line in lines):
                  out = []
                  inserted = False
                  for line in lines:
                      out.append(line)
                      if not inserted and line.strip().lower().startswith('types:'):
                          out.append('Architectures: amd64')
                          inserted = True
                  p.write_text('\n'.join(out) + '\n')
          PY
          sudo tee /etc/apt/sources.list.d/arm64.list <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF

      - name: Install pkg-config (Windows)
        if: matrix.os == 'windows-2022'
        run: choco install pkgconfiglite -y

      - name: Install Linux cross-compiler
        if: matrix.os == 'ubuntu-22.04' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross zlib1g-dev:arm64

      - name: Build (aarch64)
        if: matrix.os == 'ubuntu-22.04' && matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.os != 'ubuntu-22.04' || matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctrmml-lsp-${{ matrix.os_name }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/ctrmml-lsp*
